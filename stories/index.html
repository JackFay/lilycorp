<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lily Corp — Operator Stories (ELI5 Business Plan)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090c15;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-orange: #ff6b35;
      --accent-cyan: #00e5ff;
      --accent-green: #10b981;
      --accent-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --story-duration: 9000ms;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 107, 53, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 229, 255, 0.10) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(139, 92, 246, 0.08) 0px, transparent 60%);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Ambient glow elements */
    .glow-sphere {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
      animation: pulseGlow 12s ease-in-out infinite alternate;
    }
    .glow-1 { top: -100px; left: -100px; background: #ff6b35; }
    .glow-2 { bottom: -100px; right: -100px; background: #00e5ff; }

    @keyframes pulseGlow {
      0% { transform: scale(0.9) translate(0, 0); }
      100% { transform: scale(1.15) translate(30px, 30px); }
    }

    /* Container for the Stories Experience */
    .app-shell {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 920px;
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8),
                  0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 520px) {
      .app-shell {
        max-width: 100%;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        border: none;
      }
    }

    /* Header Bar & Story Progress Bars */
    .story-header {
      padding: 14px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 30;
      background: linear-gradient(180deg, rgba(9, 12, 21, 0.95) 0%, rgba(9, 12, 21, 0) 100%);
    }

    .progress-bar-container {
      display: flex;
      gap: 4px;
      width: 100%;
      height: 3.5px;
    }

    .progress-bar {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 4px;
      transition: width 0.1s linear;
    }

    .progress-fill.active {
      background: var(--accent-orange);
      box-shadow: 0 0 8px var(--accent-orange);
    }

    .progress-fill.completed {
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
    }

    /* Top metadata row */
    .top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-ring {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b35, #ff9e00);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #000;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 12px rgba(255, 107, 53, 0.4);
    }

    .title-area {
      display: flex;
      flex-direction: column;
    }

    .company-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-verified {
      background: var(--accent-cyan);
      color: #000;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .subtitle-area {
      font-size: 11px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.05);
    }

    /* Category Pill Selector */
    .category-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 16px 8px 16px;
      scrollbar-width: none;
      z-index: 25;
    }
    .category-pills::-webkit-scrollbar { display: none; }

    .pill-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-btn.active {
      background: rgba(255, 107, 53, 0.2);
      border-color: var(--accent-orange);
      color: #fff;
    }

    /* Story Card Viewport & Interactive Touch Zones */
    .story-viewport {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      padding: 6px 16px 20px 16px;
      z-index: 20;
    }

    /* Touch Tap zones for Instagram navigation */
    .tap-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      z-index: 10;
      cursor: pointer;
    }
    .tap-left { left: 0; }
    .tap-right { right: 0; width: 60%; }

    /* The Content Card */
    .story-card {
      position: relative;
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeInSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .category-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 107, 53, 0.15);
      border: 1px solid rgba(255, 107, 53, 0.3);
      color: var(--accent-orange);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 6px;
      width: fit-content;
    }

    .hero-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .hero-subtitle {
      font-size: 14px;
      color: var(--accent-cyan);
      font-weight: 600;
      margin-top: -6px;
    }

    /* Big Metric Badge */
    .metric-pill-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 14px;
    }

    .metric-value {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 28px;
      color: var(--accent-orange);
      line-height: 1;
    }

    .metric-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Explanatory Cards */
    .eli5-box {
      background: rgba(0, 229, 255, 0.06);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 0 12px 12px 0;
      padding: 12px 14px;
      position: relative;
    }

    .box-header {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-cyan);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .box-content {
      font-size: 14px;
      line-height: 1.45;
      color: #e2e8f0;
      font-weight: 500;
    }

    .analogy-box {
      background: rgba(139, 92, 246, 0.07);
      border-left: 4px solid var(--accent-purple);
      border-radius: 0 12px 12px 0;
      padding: 12px 14px;
    }

    .analogy-header {
      color: var(--accent-purple);
    }

    .why-box {
      background: rgba(16, 185, 129, 0.07);
      border-left: 4px solid var(--accent-green);
      border-radius: 0 12px 12px 0;
      padding: 12px 14px;
    }

    .why-header {
      color: var(--accent-green);
    }

    /* Interactive Quiz Section */
    .quiz-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px;
      margin-top: 4px;
    }

    .quiz-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #ff9e00;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quiz-question {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 10px;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .quiz-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .quiz-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .quiz-btn.correct {
      background: rgba(16, 185, 129, 0.25) !important;
      border-color: var(--accent-green) !important;
      color: #fff !important;
      font-weight: 700;
    }

    .quiz-btn.wrong {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: #ef4444 !important;
      color: #fca5a5 !important;
    }

    .quiz-feedback {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.4;
      color: #a7f3d0;
      display: none;
      animation: fadeInSlide 0.2s ease;
    }

    /* Deep Dive Expandable Drawer */
    .deep-dive-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 4px;
      transition: all 0.2s ease;
    }

    .deep-dive-toggle:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.07);
    }

    .deep-dive-drawer {
      display: none;
      background: rgba(10, 14, 23, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .deep-dive-drawer code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent-cyan);
      font-size: 11px;
    }

    /* Bottom Control Bar */
    .bottom-nav {
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(0deg, rgba(9, 12, 21, 0.95) 0%, rgba(9, 12, 21, 0) 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .story-counter {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
    }

    /* Modal Grid View for all stories */
    .grid-modal {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(9, 12, 21, 0.96);
      backdrop-filter: blur(20px);
      z-index: 100;
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .grid-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
    }

    .story-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .grid-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .grid-item:hover, .grid-item.active {
      border-color: var(--accent-orange);
      background: rgba(255, 107, 53, 0.1);
    }

    .grid-item-num {
      font-size: 10px;
      font-weight: 800;
      color: var(--accent-orange);
    }

    .grid-item-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
    }

    /* Floating Pause Hint Indicator */
    .pause-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.2s ease;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pause-indicator.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>

  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>

  <div class="app-shell" id="appShell">
    
    <!-- Top Header & Progress Bars -->
    <div class="story-header">
      <div class="progress-bar-container" id="progressBarContainer">
        <!-- Rendered dynamically -->
      </div>
      
      <div class="top-meta">
        <div class="brand-cluster">
          <div class="avatar-ring">LC</div>
          <div class="title-area">
            <div class="company-title">
              Lily Corp Operating Academy
              <span class="badge-verified">ELI5</span>
            </div>
            <div class="subtitle-area" id="headerSubtitle">Cycle 64 • 240 S. Broadway</div>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="btnToggleSound" title="Toggle Sound">🔊</button>
          <button class="icon-btn" id="btnToggleGrid" title="Show All Stories">☰</button>
          <button class="icon-btn" id="btnTogglePause" title="Pause / Play">⏸</button>
        </div>
      </div>
    </div>

    <!-- Category Filter Tabs -->
    <div class="category-pills" id="categoryPills">
      <button class="pill-btn active" data-cat="all">⚡ All Stories (12)</button>
      <button class="pill-btn" data-cat="industry_101">🏗️ Industry 101</button>
      <button class="pill-btn" data-cat="shop_floor">⚙️ The Shop Floor</button>
      <button class="pill-btn" data-cat="products">🚀 Secret Weapons</button>
      <button class="pill-btn" data-cat="commercial">🤝 Commercial</button>
      <button class="pill-btn" data-cat="finance">💰 Cash Flow</button>
    </div>

    <!-- Main Viewport for Story Card -->
    <div class="story-viewport" id="storyViewport">
      <!-- Invisible Tap Zones for Mobile Navigation -->
      <div class="tap-zone tap-left" id="tapLeft" title="Previous Story"></div>
      <div class="tap-zone tap-right" id="tapRight" title="Next Story"></div>

      <!-- Active Story Card Content -->
      <div class="story-card" id="storyCard">
        <!-- Injected via JavaScript -->
      </div>
    </div>

    <!-- Bottom Action Bar -->
    <div class="bottom-nav">
      <button class="nav-btn" id="btnPrev">← Back</button>
      <div class="story-counter" id="storyCounter">1 / 12</div>
      <button class="nav-btn" id="btnNext">Next →</button>
    </div>

    <!-- Grid View Modal -->
    <div class="grid-modal" id="gridModal">
      <div class="grid-header">
        <div class="grid-title">📚 Course Directory</div>
        <button class="icon-btn" id="btnCloseGrid">✕</button>
      </div>
      <div class="story-grid" id="storyGridList">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Floating Pause Indicator -->
    <div class="pause-indicator" id="pauseIndicator">
      <span>⏸ Story Paused</span>
    </div>

  </div>

  <script src="data.js"></script>
  <script>
    // Audio synthesizer for haptic sound effects without external audio files
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let soundEnabled = true;

    function playSound(type) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'tick') {
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'success') {
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.08); // E5
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.16); // G5
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'wrong') {
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(196, now + 0.1);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    // Story Data Collection
    let rawStories = (typeof EMBEDDED_STORIES !== 'undefined') ? [...EMBEDDED_STORIES] : [];
    let filteredStories = [];
    let currentIndex = 0;
    let isPaused = false;
    let storyTimer = null;
    let storyStartTime = 0;
    let remainingTime = 9000;
    const STORY_DURATION = 9000; // 9 seconds per story

    // DOM Elements
    const progressBarContainer = document.getElementById('progressBarContainer');
    const storyCard = document.getElementById('storyCard');
    const storyCounter = document.getElementById('storyCounter');
    const categoryPills = document.getElementById('categoryPills');
    const tapLeft = document.getElementById('tapLeft');
    const tapRight = document.getElementById('tapRight');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnTogglePause = document.getElementById('btnTogglePause');
    const btnToggleGrid = document.getElementById('btnToggleGrid');
    const btnCloseGrid = document.getElementById('btnCloseGrid');
    const gridModal = document.getElementById('gridModal');
    const storyGridList = document.getElementById('storyGridList');
    const pauseIndicator = document.getElementById('pauseIndicator');
    const btnToggleSound = document.getElementById('btnToggleSound');
    const appShell = document.getElementById('appShell');

    // Initialize App
    async function init() {
      try {
        const res = await fetch('stories.json');
        if (res.ok) {
          rawStories = await res.json();
        }
      } catch (err) {
        // Fallback to inlined data.js
      }
      const headerSub = document.getElementById('headerSubtitle');
      if (headerSub) headerSub.innerText = 'Cycle 82 • 240 S. Broadway, Aurora, IL';
      const allPill = document.querySelector('.pill-btn[data-cat="all"]');
      if (allPill) allPill.innerText = `⚡ All Stories (${rawStories.length})`;

      filterCategory('all');
      setupEventListeners();
    }

    function filterCategory(cat) {
      if (cat === 'all') {
        filteredStories = [...rawStories];
      } else {
        filteredStories = rawStories.filter(s => s.category === cat);
      }
      currentIndex = 0;
      renderProgressBars();
      showStory(currentIndex);
    }

    function renderProgressBars() {
      progressBarContainer.innerHTML = '';
      filteredStories.forEach((_, idx) => {
        const bar = document.createElement('div');
        bar.className = 'progress-bar';
        bar.onclick = (e) => {
          e.stopPropagation();
          jumpToStory(idx);
        };
        const fill = document.createElement('div');
        fill.className = 'progress-fill';
        fill.id = `fill-${idx}`;
        bar.appendChild(fill);
        progressBarContainer.appendChild(bar);
      });
    }

    function showStory(index) {
      if (index < 0 || index >= filteredStories.length) return;
      currentIndex = index;
      const story = filteredStories[currentIndex];

      // Update counter
      storyCounter.innerText = `${currentIndex + 1} / ${filteredStories.length}`;

      // Reset & Update Progress Bars
      filteredStories.forEach((_, idx) => {
        const fill = document.getElementById(`fill-${idx}`);
        if (!fill) return;
        fill.classList.remove('active', 'completed');
        fill.style.width = idx < currentIndex ? '100%' : '0%';
        if (idx < currentIndex) fill.classList.add('completed');
      });

      const currentFill = document.getElementById(`fill-${currentIndex}`);
      if (currentFill) {
        currentFill.classList.add('active');
      }

      // Render Card Content
      storyCard.innerHTML = `
        <div class="category-tag">${story.category_name}</div>
        
        <div>
          <h1 class="hero-title">${story.title}</h1>
          <div class="hero-subtitle">${story.subtitle}</div>
        </div>

        <div class="metric-pill-card">
          <div>
            <div class="metric-label">${story.metric_label}</div>
            <div style="font-size: 11px; color: var(--text-dim); margin-top: 2px;">Key Diligence Target</div>
          </div>
          <div class="metric-value">${story.key_metric}</div>
        </div>

        <div class="eli5-box">
          <div class="box-header">💡 The 10-Second ELI5</div>
          <div class="box-content">${story.eli5}</div>
        </div>

        <div class="analogy-box">
          <div class="box-header analogy-header">🎯 The Real-World Analogy</div>
          <div class="box-content">${story.analogy}</div>
        </div>

        <div class="why-box">
          <div class="box-header why-header">💰 Why Jack Cares (The Money Angle)</div>
          <div class="box-content">${story.why_jack_cares}</div>
        </div>

        <div class="quiz-card">
          <div class="quiz-title">🧠 Quick Check: Test Your Knowledge</div>
          <div class="quiz-question">${story.interactive_quiz.question}</div>
          <div class="quiz-options">
            ${story.interactive_quiz.options.map((opt, i) => `
              <button class="quiz-btn" onclick="checkAnswer(${i}, ${story.interactive_quiz.correct_index}, this, event)">
                <span>${opt}</span>
                <span class="quiz-icon"></span>
              </button>
            `).join('')}
          </div>
          <div class="quiz-feedback" id="quizFeedback">
            ${story.interactive_quiz.explanation}
          </div>
        </div>

        <div class="deep-dive-toggle" onclick="toggleDeepDive(event)">
          <span>🔍 Inspect Technical Blueprint & Citation</span>
          <span id="deepDiveIcon">▼</span>
        </div>
        <div class="deep-dive-drawer" id="deepDiveDrawer">
          <div style="margin-bottom: 6px;"><strong>Target File:</strong> <code>${story.plan_link}</code></div>
          <div>Referenced in Cloud Diligence Cycle 64 Operating Committee synthesis. Grounded in actual site visits, plant assets at 240 S. Broadway, and historical P&L Account 5120/4015 data.</div>
        </div>
      `;

      // Start timer animation
      startStoryTimer(STORY_DURATION);
    }

    function startStoryTimer(duration) {
      clearTimeout(storyTimer);
      remainingTime = duration;
      storyStartTime = Date.now();

      const currentFill = document.getElementById(`fill-${currentIndex}`);
      if (currentFill) {
        currentFill.style.transition = `width ${duration}ms linear`;
        currentFill.style.width = '100%';
      }

      storyTimer = setTimeout(() => {
        nextStory();
      }, duration);
    }

    function pauseStory() {
      if (isPaused) return;
      isPaused = true;
      clearTimeout(storyTimer);
      const elapsed = Date.now() - storyStartTime;
      remainingTime = Math.max(500, remainingTime - elapsed);

      const currentFill = document.getElementById(`fill-${currentIndex}`);
      if (currentFill) {
        const computedWidth = window.getComputedStyle(currentFill).width;
        currentFill.style.transition = 'none';
        currentFill.style.width = computedWidth;
      }

      btnTogglePause.innerText = '▶';
      pauseIndicator.classList.add('visible');
    }

    function resumeStory() {
      if (!isPaused) return;
      isPaused = false;
      btnTogglePause.innerText = '⏸';
      pauseIndicator.classList.remove('visible');
      startStoryTimer(remainingTime);
    }

    function nextStory() {
      playSound('tick');
      if (currentIndex < filteredStories.length - 1) {
        showStory(currentIndex + 1);
      } else {
        // Loop back to start or celebrate completion
        showStory(0);
      }
    }

    function prevStory() {
      playSound('tick');
      if (currentIndex > 0) {
        showStory(currentIndex - 1);
      } else {
        showStory(0);
      }
    }

    function jumpToStory(idx) {
      playSound('tick');
      showStory(idx);
    }

    // Global Quiz handler
    window.checkAnswer = function(chosenIdx, correctIdx, btnEl, ev) {
      ev.stopPropagation();
      pauseStory(); // Keep paused while reading answer
      const buttons = btnEl.parentElement.querySelectorAll('.quiz-btn');
      buttons.forEach(b => b.onclick = null); // disable further clicks

      const feedback = document.getElementById('quizFeedback');
      feedback.style.display = 'block';

      if (chosenIdx === correctIdx) {
        btnEl.classList.add('correct');
        btnEl.querySelector('.quiz-icon').innerText = '✓';
        playSound('success');
      } else {
        btnEl.classList.add('wrong');
        btnEl.querySelector('.quiz-icon').innerText = '✕';
        buttons[correctIdx].classList.add('correct');
        buttons[correctIdx].querySelector('.quiz-icon').innerText = '✓';
        playSound('wrong');
      }
    };

    // Deep dive toggle
    window.toggleDeepDive = function(ev) {
      ev.stopPropagation();
      const drawer = document.getElementById('deepDiveDrawer');
      const icon = document.getElementById('deepDiveIcon');
      if (drawer.style.display === 'block') {
        drawer.style.display = 'none';
        icon.innerText = '▼';
      } else {
        drawer.style.display = 'block';
        icon.innerText = '▲';
        pauseStory();
      }
    };

    // Navigation and Interaction Event Listeners
    function setupEventListeners() {
      // Tap Left / Right Zones
      tapLeft.addEventListener('click', (e) => {
        e.stopPropagation();
        prevStory();
      });

      tapRight.addEventListener('click', (e) => {
        e.stopPropagation();
        nextStory();
      });

      btnPrev.addEventListener('click', prevStory);
      btnNext.addEventListener('click', nextStory);

      // Press and Hold to Pause (Desktop + Mobile)
      let holdTimeout = null;
      appShell.addEventListener('mousedown', (e) => {
        if (e.target.closest('button') || e.target.closest('.quiz-card') || e.target.closest('.deep-dive-toggle')) return;
        holdTimeout = setTimeout(pauseStory, 150);
      });
      window.addEventListener('mouseup', () => {
        clearTimeout(holdTimeout);
        if (isPaused) resumeStory();
      });

      appShell.addEventListener('touchstart', (e) => {
        if (e.target.closest('button') || e.target.closest('.quiz-card') || e.target.closest('.deep-dive-toggle')) return;
        holdTimeout = setTimeout(pauseStory, 150);
      }, { passive: true });
      window.addEventListener('touchend', () => {
        clearTimeout(holdTimeout);
        if (isPaused) resumeStory();
      });

      // Pause toggle button
      btnTogglePause.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isPaused) resumeStory();
        else pauseStory();
      });

      // Sound toggle button
      btnToggleSound.addEventListener('click', (e) => {
        e.stopPropagation();
        soundEnabled = !soundEnabled;
        btnToggleSound.innerText = soundEnabled ? '🔊' : '🔇';
      });

      // Keyboard navigation
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'l') nextStory();
        if (e.key === 'ArrowLeft' || e.key === 'h') prevStory();
        if (e.key === ' ') {
          e.preventDefault();
          if (isPaused) resumeStory();
          else pauseStory();
        }
      });

      // Category Pill Filters
      categoryPills.addEventListener('click', (e) => {
        const btn = e.target.closest('.pill-btn');
        if (!btn) return;
        document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterCategory(btn.dataset.cat);
      });

      // Grid Directory Modal
      btnToggleGrid.addEventListener('click', openGrid);
      btnCloseGrid.addEventListener('click', closeGrid);
    }

    function openGrid() {
      pauseStory();
      storyGridList.innerHTML = '';
      rawStories.forEach((st, idx) => {
        const item = document.createElement('div');
        item.className = `grid-item ${idx === currentIndex ? 'active' : ''}`;
        item.innerHTML = `
          <div class="grid-item-num">${st.category_name} • Story ${idx + 1}</div>
          <div class="grid-item-title">${st.title}</div>
          <div style="font-size: 11px; color: var(--accent-cyan); font-weight: 600;">${st.key_metric}</div>
        `;
        item.onclick = () => {
          closeGrid();
          document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
          document.querySelector('.pill-btn[data-cat="all"]').classList.add('active');
          filteredStories = [...rawStories];
          renderProgressBars();
          jumpToStory(idx);
        };
        storyGridList.appendChild(item);
      });
      gridModal.style.display = 'flex';
    }

    function closeGrid() {
      gridModal.style.display = 'none';
      resumeStory();
    }

    // Launch
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
