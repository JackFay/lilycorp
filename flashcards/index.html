<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Flashcards — Business Evaluation Essentials</title>
  <meta name="description" content="Master 50 essential finance terms for evaluating a business with interactive flashcards.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0e14;
      --surface: #14161e;
      --surface-raised: #1a1d28;
      --border: rgba(255,255,255,0.06);
      --text: #e8eaf0;
      --text-muted: #8b90a0;
      --accent: #6c5ce7;
      --accent-glow: rgba(108,92,231,0.25);
      --green: #00b894;
      --green-glow: rgba(0,184,148,0.2);
      --orange: #e17055;
      --blue: #74b9ff;
      --pink: #fd79a8;
      --yellow: #ffeaa7;
      --radius: 16px;
      --radius-sm: 10px;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Ambient glow ── */
    body::before {
      content: '';
      position: fixed;
      top: -40%; left: -20%;
      width: 60%; height: 80%;
      background: radial-gradient(ellipse, rgba(108,92,231,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -30%; right: -15%;
      width: 50%; height: 70%;
      background: radial-gradient(ellipse, rgba(0,184,148,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .app { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 36px; }
    header h1 {
      font-size: 2rem; font-weight: 800;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe, #74b9ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    header p { color: var(--text-muted); margin-top: 6px; font-size: 0.92rem; }

    /* ── Progress bar ── */
    .progress-wrap {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px;
    }
    .progress-bar {
      flex: 1; height: 6px; background: var(--surface-raised);
      border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      border-radius: 99px;
      transition: width 0.4s ease;
    }
    .progress-label { font-size: 0.82rem; color: var(--text-muted); min-width: 60px; text-align: right; font-weight: 600; }

    /* ── Category pills ── */
    .categories {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-bottom: 28px;
    }
    .cat-pill {
      padding: 6px 14px; font-size: 0.78rem; font-weight: 600;
      border: 1px solid var(--border); border-radius: 99px;
      background: var(--surface); color: var(--text-muted);
      cursor: pointer; transition: all 0.25s ease;
      user-select: none;
    }
    .cat-pill:hover { border-color: rgba(255,255,255,0.12); color: var(--text); }
    .cat-pill.active {
      background: var(--accent); border-color: var(--accent);
      color: #fff; box-shadow: 0 0 16px var(--accent-glow);
    }

    /* ── Flashcard container ── */
    .card-scene {
      perspective: 1200px;
      width: 100%; max-width: 640px;
      margin: 0 auto 28px;
      height: 420px;
    }

    .card {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0.0, 0.2, 1);
      cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 36px 32px;
      display: flex; flex-direction: column;
      overflow-y: auto;
    }

    /* Front */
    .card-front {
      background: linear-gradient(145deg, var(--surface), var(--surface-raised));
      justify-content: center; align-items: center; text-align: center;
    }
    .card-front .card-category {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; margin-bottom: 16px; opacity: 0.5;
    }
    .card-front .card-term {
      font-size: 1.75rem; font-weight: 800;
      background: linear-gradient(135deg, #e8eaf0, #a29bfe);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1.3;
    }
    .card-front .flip-hint {
      position: absolute; bottom: 20px;
      font-size: 0.75rem; color: var(--text-muted); opacity: 0.5;
    }
    .card-front .flip-hint span { display: inline-block; animation: pulse-hint 2s ease-in-out infinite; }
    @keyframes pulse-hint { 0%,100%{opacity:.5} 50%{opacity:1} }

    /* Back */
    .card-back {
      background: linear-gradient(145deg, #161929, #1a1d2c);
      transform: rotateY(180deg);
    }
    .card-back .back-label {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--accent); margin-bottom: 12px;
    }
    .card-back .back-definition {
      font-size: 0.88rem; color: var(--text-muted); line-height: 1.6;
      margin-bottom: 16px; padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .card-back .back-importance-label {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--green); margin-bottom: 8px;
    }
    .card-back .back-importance {
      font-size: 0.9rem; color: var(--text); line-height: 1.65; font-weight: 500;
    }
    .card-back .back-doc {
      margin-top: auto; padding-top: 14px;
      font-size: 0.72rem; color: var(--text-muted); opacity: 0.6;
    }

    /* ── Navigation ── */
    .nav-row {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      margin-bottom: 20px;
    }
    .nav-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-size: 1.1rem;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-btn:hover { background: var(--surface-raised); border-color: rgba(255,255,255,0.12); transform: scale(1.08); }
    .nav-btn:active { transform: scale(0.95); }
    .nav-counter { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); min-width: 80px; text-align: center; }

    /* ── Confidence buttons ── */
    .confidence-row {
      display: flex; gap: 10px; justify-content: center;
    }
    .conf-btn {
      padding: 10px 22px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-muted); font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: all 0.25s;
    }
    .conf-btn:hover { transform: translateY(-2px); }
    .conf-btn.know:hover { background: rgba(0,184,148,0.15); border-color: var(--green); color: var(--green); }
    .conf-btn.fuzzy:hover { background: rgba(255,234,167,0.1); border-color: var(--yellow); color: var(--yellow); }
    .conf-btn.dunno:hover { background: rgba(225,112,85,0.15); border-color: var(--orange); color: var(--orange); }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex; justify-content: center; gap: 28px;
      margin-top: 28px; padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .stat { text-align: center; }
    .stat-val { font-size: 1.3rem; font-weight: 800; }
    .stat-val.green { color: var(--green); }
    .stat-val.yellow { color: var(--yellow); }
    .stat-val.orange { color: var(--orange); }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    /* ── Shuffle button ── */
    .shuffle-btn {
      display: block; margin: 20px auto 0;
      padding: 8px 20px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
      cursor: pointer; transition: all 0.25s;
    }
    .shuffle-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .card-scene { height: 460px; }
      header h1 { font-size: 1.5rem; }
      .card-front .card-term { font-size: 1.4rem; }
      .card-face { padding: 28px 22px; }
      .confidence-row { flex-wrap: wrap; }
    }

    /* ── Scrollbar ── */
    .card-face::-webkit-scrollbar { width: 4px; }
    .card-face::-webkit-scrollbar-track { background: transparent; }
    .card-face::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }

    /* ── Keyboard hint ── */
    .keyboard-hint {
      text-align: center; margin-top: 16px;
      font-size: 0.72rem; color: var(--text-muted); opacity: 0.4;
    }
    kbd {
      display: inline-block; padding: 2px 7px;
      background: var(--surface-raised); border: 1px solid var(--border);
      border-radius: 4px; font-family: inherit; font-size: 0.7rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Business Evaluation Flashcards</h1>
      <p>50 essential finance terms — click a card to flip</p>
    </header>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 50</div>
    </div>

    <div class="categories" id="categories"></div>

    <div class="card-scene" id="cardScene">
      <div class="card" id="card">
        <div class="card-face card-front" id="cardFront">
          <div class="card-category" id="frontCategory"></div>
          <div class="card-term" id="frontTerm"></div>
          <div class="flip-hint"><span>Click or press Space to flip</span></div>
        </div>
        <div class="card-face card-back" id="cardBack">
          <div class="back-label">Definition</div>
          <div class="back-definition" id="backDefinition"></div>
          <div class="back-importance-label">Why It Matters</div>
          <div class="back-importance" id="backImportance"></div>
          <div class="back-doc" id="backDoc"></div>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" aria-label="Previous card">←</button>
      <div class="nav-counter" id="navCounter">1 / 50</div>
      <button class="nav-btn" id="nextBtn" aria-label="Next card">→</button>
    </div>

    <div class="confidence-row">
      <button class="conf-btn know" onclick="markCard('know')">✓ Know It</button>
      <button class="conf-btn fuzzy" onclick="markCard('fuzzy')">~ Fuzzy</button>
      <button class="conf-btn dunno" onclick="markCard('dunno')">✗ Don't Know</button>
    </div>

    <div class="stats-bar">
      <div class="stat"><div class="stat-val green" id="statKnow">0</div><div class="stat-label">Know</div></div>
      <div class="stat"><div class="stat-val yellow" id="statFuzzy">0</div><div class="stat-label">Fuzzy</div></div>
      <div class="stat"><div class="stat-val orange" id="statDunno">0</div><div class="stat-label">Don't Know</div></div>
    </div>

    <button class="shuffle-btn" onclick="shuffleDeck()">⟳ Shuffle Deck</button>

    <div class="keyboard-hint">
      <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;·&nbsp; <kbd>Space</kbd> flip &nbsp;·&nbsp; <kbd>1</kbd> know &nbsp; <kbd>2</kbd> fuzzy &nbsp; <kbd>3</kbd> don't know
    </div>
  </div>

<script>
const CARDS = [
  // ─── INCOME STATEMENT (P&L) ───
  {
    term: "Revenue (Top Line)",
    category: "Income Statement",
    document: "Found on: Profit & Loss Statement (P&L), line 1",
    definition: "The total amount of money a business brings in from selling its goods or services before any costs are subtracted. Also called \"Sales\" or \"Top Line\" because it sits at the very top of the P&L.",
    importance: "This is the starting point of every financial conversation. If revenue is shrinking, almost nothing else matters — the business is losing its ability to generate money. When evaluating a business, you want to see revenue that's stable or growing, ideally from multiple customer sources rather than one big client."
  },
  {
    term: "Cost of Goods Sold (COGS)",
    category: "Income Statement",
    document: "Found on: Profit & Loss Statement (P&L)",
    definition: "The direct costs tied to producing or delivering the product/service — materials, direct labor, freight, manufacturing overhead. If you sell resin products, the resin itself and the labor to mold it are COGS.",
    importance: "COGS tells you how efficiently a business turns raw inputs into sellable products. A company with high COGS relative to revenue has thin margins and little room for error. When COGS creep up without revenue following, it's a red flag — often caused by supplier price hikes, waste, or inefficiency."
  },
  {
    term: "Gross Profit",
    category: "Income Statement",
    document: "Found on: Profit & Loss Statement (P&L)",
    definition: "Revenue minus COGS. It's the money left over after covering the direct costs of making the product, but before paying for rent, salaries, marketing, and other overhead.",
    importance: "This is your first real indicator of business health. Strong gross profit means the core product has healthy economics. If gross profit is low or negative, no amount of cost-cutting on the overhead side will save the business — the product itself doesn't make enough money."
  },
  {
    term: "Gross Margin (%)",
    category: "Income Statement",
    document: "Found on: Profit & Loss Statement (P&L) — calculated",
    definition: "Gross Profit divided by Revenue, expressed as a percentage. If you make $700K in gross profit on $1M revenue, your gross margin is 70%.",
    importance: "Lets you compare profitability across businesses regardless of size. A 70% gross margin company is fundamentally different from a 20% one — the first has pricing power and room for overhead, the second is grinding. Industry benchmarks matter here: SaaS companies often hit 80%+, while manufacturing might be 25-40%."
  },
  {
    term: "Operating Expenses (OpEx)",
    category: "Income Statement",
    document: "Found on: Profit & Loss Statement (P&L)",
    definition: "All the costs of running the business that aren't directly tied to making the product — rent, utilities, office salaries, marketing, insurance, software subscriptions, professional services. Sometimes called SG&A (Selling, General & Administrative).",
    importance: "This is where you see if a business is lean or bloated. High OpEx relative to revenue means the business needs a lot of infrastructure to keep running. When acquiring a business, OpEx is often where you find the most room for improvement — redundant roles, overpriced vendors, or unnecessary spending."
  },
  {
    term: "SG&A (Selling, General & Administrative)",
    category: "Income Statement",
    document: "Found on: Profit & Loss Statement (P&L)",
    definition: "A subset of operating expenses that captures sales team costs, executive salaries, office expenses, legal/accounting fees, and administrative overhead. Essentially all the costs of running the business that aren't production or R&D.",
    importance: "SG&A as a percentage of revenue reveals operational efficiency. If SG&A is 50% of revenue, half of every dollar earned goes to just keeping the lights on. Acquirers love finding businesses with high SG&A because there's often low-hanging fruit to cut — especially owner perks, redundant admin roles, or overpriced services."
  },
  {
    term: "EBITDA",
    category: "Income Statement",
    document: "Found on: Derived from P&L — not a GAAP line item",
    definition: "Earnings Before Interest, Taxes, Depreciation, and Amortization. You take net income and add back interest payments, tax expenses, depreciation, and amortization. It strips out financing decisions, tax strategies, and accounting write-downs.",
    importance: "EBITDA is the single most important number when buying/selling a small business. It's used as a proxy for the cash-generating power of the business, removing things the new owner will change anyway (their own debt structure, tax strategy). Business valuations are typically expressed as a \"multiple of EBITDA\" (e.g., 3-5x EBITDA for small businesses)."
  },
  {
    term: "EBITDA Margin (%)",
    category: "Income Statement",
    document: "Found on: Derived from P&L — calculated",
    definition: "EBITDA divided by Revenue, expressed as a percentage. Shows what percentage of every revenue dollar becomes operating cash flow before capital structure effects.",
    importance: "A 20%+ EBITDA margin is generally considered healthy for a small business. This number tells you how much actual cash-flow cushion the business has. Low EBITDA margins (under 10%) mean the business is one bad quarter away from losing money — there's no buffer for unexpected costs, revenue dips, or new investments."
  },
  {
    term: "Adjusted EBITDA / Seller's Discretionary Earnings (SDE)",
    category: "Income Statement",
    document: "Found on: Derived / Recast financials",
    definition: "EBITDA with additional adjustments for owner-specific expenses: the owner's salary, personal expenses run through the business (car, phone, meals, family members on payroll), one-time costs, and non-recurring items. SDE is common for businesses under ~$5M revenue.",
    importance: "This is what a buyer is really buying — the true economic benefit to the owner. Many small business owners run personal expenses through the business to reduce taxes, which makes the P&L look worse than reality. Recasting to SDE reveals the actual earnings a new owner would pocket. This is often 30-50% higher than reported net income."
  },
  {
    term: "Net Income (Bottom Line)",
    category: "Income Statement",
    document: "Found on: Profit & Loss Statement (P&L), last line",
    definition: "What's left after ALL expenses — COGS, OpEx, interest, taxes, depreciation, everything. This is the accounting profit of the business.",
    importance: "Net income is the \"official\" profit, but it can be misleading for small businesses. Owners often minimize it on purpose to reduce taxes. A business showing $50K net income might actually generate $250K in real cash flow once you add back owner salary, depreciation, and personal expenses. Never judge a small business solely by net income."
  },
  {
    term: "Depreciation",
    category: "Income Statement",
    document: "Found on: P&L and Balance Sheet",
    definition: "An accounting method that spreads the cost of a physical asset (equipment, vehicles, buildings) over its useful life. If you buy a $100K machine expected to last 10 years, you might record $10K/year in depreciation expense rather than the full $100K upfront.",
    importance: "Depreciation is a non-cash expense — no money actually leaves the bank account each period. That's why it gets added back in EBITDA. But it signals something real: the business has aging assets that will eventually need replacing. If a business has huge depreciation, ask yourself: when will this equipment need to be replaced, and at what cost?"
  },
  {
    term: "Amortization",
    category: "Income Statement",
    document: "Found on: P&L and Balance Sheet",
    definition: "Same concept as depreciation, but for intangible assets — patents, trademarks, customer lists, goodwill from acquisitions, software licenses. Spreads the cost of these intangibles over their useful life.",
    importance: "Like depreciation, it's non-cash and gets added back to EBITDA. In acquisitions, amortization of goodwill is especially relevant: when you buy a business for more than its tangible asset value, the excess (goodwill) gets amortized, creating a tax benefit. Understanding this helps you model post-acquisition tax savings."
  },
  {
    term: "Interest Expense",
    category: "Income Statement",
    document: "Found on: Profit & Loss Statement (P&L)",
    definition: "The cost of borrowing money — payments on business loans, credit lines, equipment financing, or any other debt the business carries.",
    importance: "Interest expense reflects the current owner's financing decisions, not the business's operating strength. That's why it's excluded from EBITDA. As a buyer, you'll have your own debt structure (e.g., SBA loan), so the seller's interest expense is irrelevant to your analysis. High interest expense on a seller's P&L isn't necessarily bad — it just means they were leveraged."
  },
  // ─── BALANCE SHEET ───
  {
    term: "Balance Sheet",
    category: "Balance Sheet",
    document: "One of the three core financial statements",
    definition: "A snapshot of what the business owns (Assets), what it owes (Liabilities), and the residual value belonging to the owners (Equity) at a single point in time. The fundamental equation: Assets = Liabilities + Equity.",
    importance: "The P&L tells you how the business performed over a period; the balance sheet tells you what it's worth right now. When buying a business, the balance sheet reveals hidden risks — excessive debt, aging receivables, overvalued inventory, or contingent liabilities that don't show up on the income statement."
  },
  {
    term: "Assets",
    category: "Balance Sheet",
    document: "Found on: Balance Sheet (left side or top)",
    definition: "Everything the business owns or is owed. Split into Current Assets (cash, receivables, inventory — things convertible to cash within a year) and Non-Current/Fixed Assets (equipment, property, patents — longer-term holdings).",
    importance: "Assets are what you're partly paying for in an acquisition. But not all assets are created equal: cash is king, receivables are only as good as the customers who owe them, and inventory might be obsolete. Always dig into the composition and quality of assets, not just the total number."
  },
  {
    term: "Current Assets",
    category: "Balance Sheet",
    document: "Found on: Balance Sheet",
    definition: "Assets expected to be converted to cash or used up within one year: cash on hand, accounts receivable, inventory, and prepaid expenses.",
    importance: "Current assets tell you about the business's short-term liquidity — can it pay its bills? A business with lots of current assets relative to current liabilities is in a safer position. But look at the mix: a company with $500K in current assets but $400K of that is slow-moving inventory is very different from one with $400K in cash."
  },
  {
    term: "Accounts Receivable (A/R)",
    category: "Balance Sheet",
    document: "Found on: Balance Sheet (Current Assets)",
    definition: "Money that customers owe the business for goods or services already delivered but not yet paid for. If you shipped $50K of product last month on Net 30 terms, that $50K sits in A/R until the customer pays.",
    importance: "A/R is revenue that's been earned but not collected. High A/R means the business is essentially lending money to its customers. Look at the aging: A/R under 30 days is normal, but A/R over 90 days is a warning sign — it might never be collected. In an acquisition, you often negotiate how A/R is handled (does it transfer, or does the seller collect it?)."
  },
  {
    term: "Inventory",
    category: "Balance Sheet",
    document: "Found on: Balance Sheet (Current Assets)",
    definition: "The value of raw materials, work-in-progress, and finished goods the business holds for sale. For a resin products company, this includes raw resin, partially completed molds, and finished products on shelves.",
    importance: "Inventory ties up cash. A business carrying $500K in inventory has $500K that could be earning returns elsewhere. Worse, inventory can become obsolete, damaged, or overvalued. In acquisitions, inventory valuation is a major negotiation point — you don't want to pay full price for dead stock that will never sell."
  },
  {
    term: "Accounts Payable (A/P)",
    category: "Balance Sheet",
    document: "Found on: Balance Sheet (Current Liabilities)",
    definition: "Money the business owes to its suppliers and vendors for goods or services received but not yet paid for. The flip side of A/R — this is the business being the borrower.",
    importance: "A/P is essentially free short-term financing from suppliers. Healthy businesses manage A/P strategically — paying on time to maintain relationships while using the float period to keep cash working. Abnormally high A/P can signal cash flow problems (the business is stretching payments because it can't afford to pay). In due diligence, always check for overdue A/P."
  },
  {
    term: "Liabilities",
    category: "Balance Sheet",
    document: "Found on: Balance Sheet (right side or bottom)",
    definition: "Everything the business owes — from short-term bills (A/P, credit card balances, accrued wages) to long-term obligations (bank loans, equipment financing, lease obligations).",
    importance: "Liabilities reveal the business's debt burden and obligations. In many small business acquisitions, you buy the assets but NOT the liabilities — meaning the seller pays off debts at closing. But some liabilities transfer: lease obligations, customer deposits, warranty commitments. Understanding which liabilities you're inheriting is critical to avoiding surprises."
  },
  {
    term: "Working Capital",
    category: "Balance Sheet",
    document: "Found on: Derived from Balance Sheet",
    definition: "Current Assets minus Current Liabilities. Measures the short-term financial health and operational liquidity of the business. If current assets are $300K and current liabilities are $200K, working capital is $100K.",
    importance: "Working capital is the fuel that keeps daily operations running — buying inventory, making payroll, covering bills while waiting for customers to pay. A business needs adequate working capital to function. In acquisitions, a working capital target (\"peg\") is usually set, and the purchase price adjusts up or down based on the actual working capital at closing."
  },
  {
    term: "Equity / Owner's Equity",
    category: "Balance Sheet",

    definition: "Assets minus Liabilities. Represents the owner's residual claim on the business after all debts are paid. Includes initial investment, retained earnings, and any additional capital contributions.",
    importance: "Think of equity as the owner's \"net worth\" in the business. Negative equity means the business owes more than it owns — a red flag. But for small businesses, equity can be misleading because owners often pull profits out (distributions), which reduces equity but doesn't mean the business is unhealthy. Focus more on cash flow than book equity."

    importance: "Goodwill is what makes a business worth more than the sum of its parts. It reflects the value of the customer base, reputation, systems, and earning power. For buyers, it's often the biggest asset on the post-acquisition balance sheet. The tax treatment (amortizable over 15 years for asset purchases) creates real cash savings."

    importance: "Book value is rarely what a business is actually worth. Assets are recorded at historical cost minus depreciation, which may be far from market value. A building purchased 20 years ago might be on the books at $100K but worth $800K. Most profitable businesses sell for well above book value — the difference is the value of the business as a going concern."

    importance: "FCF is what's actually available to the owner — for distributions, debt repayment, or reinvestment in growth. A business with $500K EBITDA but $400K in required annual CapEx really only generates $100K for the owner. FCF cuts through accounting abstractions and answers: 'How much cash can I actually take out of this business?'"

  // ─── VALUATION & DEAL METRICS ───
  {
    term: "Valuation Multiple",

  {

  {

  {

  {

  {

  // ─── PROFITABILITY & RATIOS ───
  {

    importance: "Gives you the clearest picture of overall efficiency. A 5% net margin means 95 cents of every dollar goes to costs — there's almost no room for error. Compare across years and against industry benchmarks. For small businesses, artificially low net margins (due to owner perks and tax strategies) are common, which is why SDE/Adjusted EBITDA is used instead."

  {

  {

    importance: "Answers the question: 'Is my money working hard enough in this business versus other investments?' An ROE of 15% means for every dollar of equity, the business generates 15 cents of profit. However, high ROE can be achieved by having very little equity (lots of debt), which increases risk. Always look at ROE alongside debt levels."

  {

    importance: "This ratio reveals financial risk. Highly leveraged businesses (3:1+) amplify returns in good times but can collapse in downturns — debt payments don't shrink when revenue does. For acquisition financing, lenders look at this ratio closely. SBA lenders generally want to see manageable leverage post-acquisition. A healthy ratio depends on industry but typically 1:1 to 2:1 for small businesses."
  },
  {
    term: "Current Ratio",
    category: "Ratios",

  {

  {

  },

  {

  {

// ── State ──
let currentIndex = 0;
let activeCategory = 'All';
let filteredCards = [...CARDS];
let ratings = {};  // cardIndex -> 'know' | 'fuzzy' | 'dunno'

// ── DOM refs ──
const card = document.getElementById('card');
const frontCategory = document.getElementById('frontCategory');
const frontTerm = document.getElementById('frontTerm');
const backDefinition = document.getElementById('backDefinition');
const backImportance = document.getElementById('backImportance');
const backDoc = document.getElementById('backDoc');
const navCounter = document.getElementById('navCounter');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const statKnow = document.getElementById('statKnow');
const statFuzzy = document.getElementById('statFuzzy');
const statDunno = document.getElementById('statDunno');
const categoriesEl = document.getElementById('categories');

// ── Init categories ──
function initCategories() {
  const cats = ['All', ...new Set(CARDS.map(c => c.category))];
  categoriesEl.innerHTML = cats.map(c =>
    `<button class="cat-pill${c === activeCategory ? ' active' : ''}" data-cat="${c}">${c}</button>`
  ).join('');
  categoriesEl.querySelectorAll('.cat-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      filterCards();
      categoriesEl.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
}

function filterCards() {
  filteredCards = activeCategory === 'All' ? [...CARDS] : CARDS.filter(c => c.category === activeCategory);
  currentIndex = 0;
  render();
}

// ── Render ──
function render() {
  if (filteredCards.length === 0) return;
  const c = filteredCards[currentIndex];
  frontCategory.textContent = c.category;
  frontTerm.textContent = c.term;
  backDefinition.textContent = c.definition;
  backImportance.textContent = c.importance;
  backDoc.textContent = c.document;
  navCounter.textContent = `${currentIndex + 1} / ${filteredCards.length}`;
  card.classList.remove('flipped');
  updateStats();
}

function updateStats() {
  let know = 0, fuzzy = 0, dunno = 0;
  Object.values(ratings).forEach(r => {
    if (r === 'know') know++;
    else if (r === 'fuzzy') fuzzy++;
    else dunno++;
  });
  statKnow.textContent = know;
  statFuzzy.textContent = fuzzy;
  statDunno.textContent = dunno;
  const total = Object.keys(ratings).length;
  progressFill.style.width = `${(total / CARDS.length) * 100}%`;
  progressLabel.textContent = `${total} / ${CARDS.length}`;
}

// ── Actions ──
function flipCard() { card.classList.toggle('flipped'); }
function nextCard() { currentIndex = (currentIndex + 1) % filteredCards.length; render(); }
function prevCard() { currentIndex = (currentIndex - 1 + filteredCards.length) % filteredCards.length; render(); }

function markCard(rating) {
  const c = filteredCards[currentIndex];
  const globalIndex = CARDS.indexOf(c);
  ratings[globalIndex] = rating;
  updateStats();
  // Auto-advance after a beat
  setTimeout(nextCard, 300);
}

function shuffleDeck() {
  for (let i = filteredCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredCards[i], filteredCards[j]] = [filteredCards[j], filteredCards[i]];
  }
  currentIndex = 0;
  render();
}

// ── Event Listeners ──
document.getElementById('cardScene').addEventListener('click', flipCard);
document.getElementById('prevBtn').addEventListener('click', prevCard);
document.getElementById('nextBtn').addEventListener('click', nextCard);

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  else if (e.code === 'ArrowRight') nextCard();
  else if (e.code === 'ArrowLeft') prevCard();
  else if (e.key === '1') markCard('know');
  else if (e.key === '2') markCard('fuzzy');
  else if (e.key === '3') markCard('dunno');
});

// ── Swipe support ──
let touchStartX = 0;
document.getElementById('cardScene').addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
}, {passive: true});
document.getElementById('cardScene').addEventListener('touchend', e => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(diff) > 60) {
    if (diff < 0) nextCard(); else prevCard();
  }
});

// ── Go ──
initCategories();
render();
</script>
